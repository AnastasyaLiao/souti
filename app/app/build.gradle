plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// AI 凭据彻底不在客户端：识别与追问都走 fchat 服务器的 /qa/analyze/ 与 /qa/chat/，
// key 只存在服务端的 ai_config 表里。所以这里不再往 BuildConfig 塞任何东西——
// 以前塞的是"构建时从 local.properties 取"，现在连取都不用取了。

android {
    namespace 'com.souti.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.souti.ai"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            // debug 默认签名即可安装
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    // 登录态（access/refresh 两枚 JWT）落盘加密用
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    def camerax = "1.4.2"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
