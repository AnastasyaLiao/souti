plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// DeepSeek Key 一律不进版本库。取值优先级：-PDEEPSEEK_API_KEY > 环境变量 > 根目录 local.properties。
// 三个来源都没有时得到空串 —— 这是有意的默认值：别人 clone 下来直接构建出来的包不带任何凭据，
// 装上去会明确提示「未配置 API Key」（见 DeepSeekClient），而不是悄悄用掉站主的余额。
// local.properties 是 Android Studio 自己维护的文件，天生在 .gitignore 里，本机放真实 Key 最省事。
def resolveDeepseekKey() {
    def lp = rootProject.file('local.properties')
    def fromLocal = null
    if (lp.exists()) {
        def p = new Properties()
        lp.withInputStream { p.load(it) }
        fromLocal = p.getProperty('DEEPSEEK_API_KEY')
    }
    def picked = [project.findProperty('DEEPSEEK_API_KEY'),
                  System.getenv('DEEPSEEK_API_KEY'),
                  fromLocal].find { it && it.toString().trim() }
    // 去掉引号与反斜杠：值要原样拼进 Java 字符串字面量，不能让它把 BuildConfig 撑破
    return (picked ?: '').toString().trim().replaceAll(/["\\]/, '')
}

android {
    namespace 'com.souti.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.souti.ai"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "DEEPSEEK_KEY", "\"${resolveDeepseekKey()}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            // debug 默认签名即可安装
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    def camerax = "1.4.2"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
